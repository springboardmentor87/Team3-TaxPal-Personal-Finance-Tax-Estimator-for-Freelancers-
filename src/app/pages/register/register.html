<div class="register-container">
  <div class="register-card">
    <h2>Create an Account</h2>
    <p>Enter your information to create your TaxPal account</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <label>Username</label>
      <input type="text" formControlName="username" placeholder="Choose a username" />

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Choose a password" />

      <label>Full Name</label>
      <input type="text" formControlName="fullName" placeholder="Enter your full name" />

      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter your email address" />

      <label>Country</label>
      <select formControlName="country">
        <option value="">Select your country</option>
        <option value="US">United States</option>
        <option value="IN">India</option>
        <option value="UK">United Kingdom</option>
      </select>

      <label>Income Bracket (Optional)</label>
      <select formControlName="incomeBracket">
        <option value="">Select your income bracket</option>
        <option value="low">Low</option>
        <option value="middle">Middle</option>
        <option value="high">High</option>
      </select>

      <button type="submit" [disabled]="registerForm.invalid">Create Account</button>
    </form>

    <p>Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
